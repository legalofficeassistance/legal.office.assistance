<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Форма клієнта – Prison Justice</title>
<meta name="description" content="Форма Prison Justice для опису умов відбування покарання у місцях позбавлення волі в Словенії.">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {font-family:Arial,sans-serif;background:#f2f2f2;margin:0;}
.container {max-width:900px;background:#fff;margin:20px auto;padding:20px;border-radius:6px;}
.step{display:none;}
.step.active{display:block;}
label{display:block;margin-top:10px;font-weight:bold;}
small{display:block;color:#555;font-weight:normal;}
input,textarea,select{width:100%;padding:8px;margin-top:4px;}
textarea{min-height:60px;}
button{padding:10px 15px;margin-top:15px;cursor:pointer;}
.box{border:1px solid #ccc;padding:12px;margin-top:15px;border-radius:4px;}
.progress{height:8px;background:#ddd;border-radius:4px;margin-bottom:20px;}
.progress-bar{height:8px;background:#2a8f3a;width:0%;border-radius:4px;}
.preview{white-space:pre-wrap;background:#f9f9f9;padding:12px;}
.warning{color:red;font-weight:bold;margin-top:15px;}
</style>
</head>

<body>
<div class="container">

<div class="progress"><div class="progress-bar" id="progressBar"></div></div>

<form>

<!-- STEP 1 -->
<div class="step active">
<h2>Особисті дані</h2>

<label>Ім’я</label><input id="firstName">
<label>Прізвище</label><input id="lastName">

<label>Davčna številka</label>
<small>Податковий номер у Словенії (аналог NIP)</small>
<input id="taxNumber">

<label>EMŠO</label>
<small>Єдиний ідентифікаційний номер (аналог PESEL)</small>
<input id="emso">
</div>

<!-- STEP 2 -->
<div class="step">
<h2>Контактні дані</h2>
<label>Телефон</label><input id="phone">
<label>Email</label><input id="email">
</div>

<!-- STEP 3 -->
<div class="step">
<h2>Вʼязниця та камери</h2>

<label>Виправна установа</label>
<select id="prisonName">
<option>ZPKZ Ljubljana</option>
<option>ZPKZ Dob pri Mirni</option>
<option>ZPKZ Celje</option>
<option>ZPKZ Maribor</option>
</select>

<label>Період перебування з</label>
<input type="date" id="prisonFrom">
<label>Період перебування до</label>
<input type="date" id="prisonTo">

<div id="cells"></div>
<button type="button" onclick="addCell()">➕ Додати камеру</button>
</div>

<!-- STEP 4 -->
<div class="step">
<h2>Готово – експорт</h2>

<div class="preview" id="preview"></div>

<button type="button" onclick="downloadPDF()">📄 PDF</button>
<button type="button" onclick="downloadDOC()">📝 DOC</button>
<button type="button" onclick="sendMail()">✉️ EMAIL</button>

<div class="warning">
Поля опису залишаються мовою клієнта.
</div>
</div>

<div>
<button type="button" onclick="prev()">⬅ Назад</button>
<button type="button" onclick="next()">Далі ➡</button>
</div>

</form>
</div>

<script>
let step=0;
const steps=document.querySelectorAll(".step");

function showStep(){
  steps.forEach((s,i)=>s.classList.toggle("active",i===step));
  document.getElementById("progressBar").style.width=((step+1)/steps.length*100)+"%";
  if(step===steps.length-1) buildPreview();
}
function next(){ if(step<steps.length-1){step++;showStep();} }
function prev(){ if(step>0){step--;showStep();} }

let cellCounter=0;
function addCell(){
  cellCounter++;
  const d=document.createElement("div");
  d.className="box";
  d.innerHTML=`
    <h4>Камера ${cellCounter}</h4>

    <label>Номер камери</label>
    <input data-field="cellNo_${cellCounter}">

    <label>Особи з камери / співкамерники</label>
    <textarea data-field="mates_${cellCounter}"></textarea>
  `;
  document.getElementById("cells").appendChild(d);
}

function collect(){
  const cells=[];
  document.querySelectorAll("#cells .box").forEach((c,i)=>{
    const idx=i+1;
    cells.push({
      number: idx,
      cellNo: c.querySelector(`[data-field="cellNo_${idx}"]`).value,
      cellMates: c.querySelector(`[data-field="mates_${idx}"]`).value
    });
  });

  return {
    firstName:firstName.value,
    lastName:lastName.value,
    taxNumber:taxNumber.value,
    emso:emso.value,
    phone:phone.value,
    email:email.value,
    prison:{
      name:prisonName.value,
      from:prisonFrom.value,
      to:prisonTo.value,
      cells:cells
    }
  };
}

function buildPreview(){
  preview.textContent = JSON.stringify(collect(), null, 2);
}

function downloadPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const text = preview.textContent.split("\n");
  let y = 10;
  text.forEach(line=>{
    doc.text(line,10,y);
    y+=7;
    if(y>280){ doc.addPage(); y=10; }
  });
  doc.save("prison_justice_ua.pdf");
}

function downloadDOC(){
  const blob = new Blob(
    ["Prison Justice\n\n" + preview.textContent],
    {type:"application/msword"}
  );
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "prison_justice_ua.doc";
  a.click();
}

function sendMail(){
  window.location.href =
    "mailto:contact@prison-justice.pl" +
    "?subject=Prison Justice – UA Form" +
    "&body=" + encodeURIComponent(preview.textContent);
}

showStep();
</script>

</body>
</html>
