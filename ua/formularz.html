<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Formularz klienta – Prison Justice PL</title>
<meta name="description" content="Formularz Prison Justice PL do opisu warunków odbywania kary pozbawienia wolności w Słowenii.">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {font-family:Arial,sans-serif;background:#f2f2f2;margin:0;}
.container {max-width:900px;background:#fff;margin:20px auto;padding:20px;border-radius:6px;}
.step{display:none;}
.step.active{display:block;}
label{display:block;margin-top:10px;font-weight:bold;}
input,textarea,select{width:100%;padding:8px;margin-top:4px;}
textarea{min-height:60px;}
button{padding:10px 15px;margin-top:15px;cursor:pointer;}
.box{border:1px solid #ccc;padding:12px;margin-top:15px;border-radius:4px;}
.progress{height:8px;background:#ddd;border-radius:4px;margin-bottom:20px;}
.progress-bar{height:8px;background:#2a8f3a;width:0%;border-radius:4px;}
.preview{white-space:pre-wrap;background:#f9f9f9;padding:12px;}
.warning{color:red;font-weight:bold;margin-top:15px;}
.top-nav{margin-bottom:15px;}
.back-home{color:#003366;font-weight:bold;text-decoration:none;}
</style>
</head>

<body>
<div class="container">

<div class="top-nav">
  <a href="index.html" class="back-home" data-i18n="back_home"></a>
</div>

<div class="progress"><div class="progress-bar" id="progressBar"></div></div>

<form id="form">

<!-- STEP 1 -->
<div class="step active">
<h2 data-i18n="personal_data"></h2>

<label data-i18n="first_name"></label><input id="firstName">
<label data-i18n="last_name"></label><input id="lastName">

<label data-i18n="street"></label><input id="street">
<label data-i18n="house_no"></label><input id="houseNo">
<label data-i18n="flat_no"></label><input id="flatNo">
<label data-i18n="postal_code"></label><input id="postalCode">
<label data-i18n="city"></label><input id="city">
<label data-i18n="country"></label><input id="country">
</div>

<!-- STEP 2 -->
<div class="step">
<h2 data-i18n="contact"></h2>
<label data-i18n="phone"></label><input id="phone">
<label data-i18n="email"></label><input id="email">
</div>

<!-- STEP 3 -->
<div class="step">
<h2 data-i18n="case_data"></h2>
<label data-i18n="case_no"></label><input id="caseNo">
<label data-i18n="judgment_date"></label><input type="date" id="judgmentDate">
<label data-i18n="court_city"></label><input id="courtCity">
</div>

<!-- STEP 4 -->
<div class="step">
<h2 data-i18n="language_regulations"></h2>

<label data-i18n="language_label"></label>
<input id="descriptionLanguage">

<label data-i18n="regulations_label"></label>
<select id="regulations">
  <option value="yes" data-i18n="yes"></option>
  <option value="no" data-i18n="no"></option>
</select>
</div>

<!-- STEP 5 -->
<div class="step">
<h2 data-i18n="pressure"></h2>

<label data-i18n="blackmail_q"></label>
<select id="blackmail">
  <option value="yes" data-i18n="yes"></option>
  <option value="no" data-i18n="no"></option>
</select>
<textarea id="blackmailDesc" data-i18n-placeholder="description_placeholder"></textarea>

<label data-i18n="intimidation_q"></label>
<select id="intimidation">
  <option value="yes" data-i18n="yes"></option>
  <option value="no" data-i18n="no"></option>
</select>
<textarea id="intimidationDesc" data-i18n-placeholder="description_placeholder"></textarea>
</div>

<!-- STEP 6 -->
<div class="step">
<h2 data-i18n="prison_cells"></h2>

<label data-i18n="prison"></label>
<select id="prisonName">
  <option>ZPKZ Ljubljana</option>
  <option>ZPKZ Dob pri Mirni</option>
  <option>ZPKZ Celje</option>
  <option>ZPKZ Maribor</option>
  <option>ZPKZ Novo Mesto</option>
  <option>ZPKZ Koper</option>
</select>

<label data-i18n="stay_from"></label><input type="date" id="prisonFrom">
<label data-i18n="stay_to"></label><input type="date" id="prisonTo">

<h3 data-i18n="cells"></h3>
<div id="cells"></div>
<button type="button" onclick="addCell()" data-i18n="add_cell"></button>
</div>

<!-- STEP 7 -->
<div class="step">
<h2 data-i18n="json_preview"></h2>
<div class="preview" id="preview"></div>

<div class="warning" data-i18n="language_warning"></div>

<button type="button" onclick="downloadTXT()">TXT</button>
<button type="button" onclick="downloadPDF()">PDF</button>
<button type="button" onclick="sendMail()">EMAIL</button>
</div>

<div>
<button type="button" onclick="prev()" data-i18n="back"></button>
<button type="button" onclick="next()" data-i18n="next"></button>
</div>

</form>
</div>

<script>
/* ==== MULTI LANGUAGE CORE ==== */
const LANG = {
  pl: {
    back_home:"← Powrót do strony głównej",
    personal_data:"Dane osobowe",
    first_name:"Imię",
    last_name:"Nazwisko",
    street:"Ulica",
    house_no:"Numer domu",
    flat_no:"Numer mieszkania",
    postal_code:"Kod pocztowy",
    city:"Miasto",
    country:"Kraj",
    contact:"Kontakt",
    phone:"Telefon",
    email:"Email",
    case_data:"Dane sprawy",
    case_no:"Sygnatura wyroku (na podstawie którego odbywałeś karę w Słowenii)",
    judgment_date:"Data wyroku",
    court_city:"Miasto sądu skazującego",
    language_regulations:"Język i regulamin",
    language_label:"Język, którym władasz (ojczysty / rozumiany)",
    regulations_label:"Czy otrzymałeś regulamin więzienny?",
    yes:"Tak",
    no:"Nie",
    pressure:"Szantaż i zastraszanie",
    blackmail_q:"Czy byłeś szantażowany przez prokuratora?",
    intimidation_q:"Czy byłeś zastraszany przez administrację więzienia?",
    description_placeholder:"Opis",
    prison_cells:"Więzienie i cele",
    prison:"Zakład karny",
    stay_from:"Pobyt od",
    stay_to:"Pobyt do",
    cells:"Cele",
    add_cell:"➕ Dodaj kolejną celę",
    json_preview:"Podgląd JSON",
    language_warning:"Opisy pozostają w oryginalnym języku klienta.",
    back:"Wstecz",
    next:"Dalej"
  }
};

const L = "pl";

document.querySelectorAll("[data-i18n]").forEach(el=>{
  el.innerText = LANG[L][el.dataset.i18n] || "";
});
document.querySelectorAll("[data-i18n-placeholder]").forEach(el=>{
  el.placeholder = LANG[L][el.dataset.i18nPlaceholder] || "";
});
</script>

</body>
</html>
