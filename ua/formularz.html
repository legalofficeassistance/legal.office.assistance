<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Форма клієнта – Prison Justice UA</title>
<meta name="description" content="Офіційна форма Prison Justice UA. Дані зберігаються у форматі JSON для подальшої юридичної обробки.">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {font-family:Arial, sans-serif; background:#f2f2f2; margin:0;}
.container {max-width:900px; background:#fff; margin:20px auto; padding:20px; border-radius:6px;}
.step {display:none;}
.step.active {display:block;}
label {display:block; margin-top:10px; font-weight:bold;}
input, textarea, select {width:100%; padding:8px; margin-top:4px;}
textarea {min-height:60px;}
button {padding:10px 15px; margin-top:15px; cursor:pointer;}
.box {border:1px solid #ccc; padding:12px; margin-top:15px; border-radius:4px;}
.progress {height:8px; background:#ddd; border-radius:4px; margin-bottom:20px;}
.progress-bar {height:8px; background:#2a8f3a; width:0%; border-radius:4px;}
.preview {white-space:pre-wrap; background:#f9f9f9; padding:12px;}
.warning {color:red; font-weight:bold; margin-top:15px;}
</style>
</head>

<body>
<div class="container">

<div class="progress"><div class="progress-bar" id="progressBar"></div></div>

<form id="form">

<!-- STEP 1 -->
<div class="step active">
<h2>Особисті дані</h2>
<label>Ім’я</label><input id="firstName">
<label>Прізвище</label><input id="lastName">
<label>Адреса</label><textarea id="address"></textarea>
</div>

<!-- STEP 2 -->
<div class="step">
<h2>Контактні дані</h2>
<label>Телефон</label><input id="phone">
<label>Email</label><input id="email">
</div>

<!-- STEP 3 -->
<div class="step">
<h2>Дані справи</h2>
<label>Номер вироку</label><input id="caseNo">
<label>Дата вироку</label><input type="date" id="judgmentDate">
<label>Місто суду</label><input id="courtCity">
</div>

<!-- STEP 4 -->
<div class="step">
<h2>Мова та регламент</h2>

<label>Мова, якою ви розумієте регламент</label>
<input id="languageUnderstood">

<label>Чи отримали ви регламент?</label>
<select id="regulations">
  <option value="yes">Так</option>
  <option value="no">Ні</option>
</select>
</div>

<!-- STEP 5 -->
<div class="step">
<h2>Тиск та залякування</h2>

<label>Чи був шантаж з боку прокурора?</label>
<select id="blackmail">
  <option value="yes">Так</option>
  <option value="no">Ні</option>
</select>
<textarea id="blackmailDesc" placeholder="Опишіть ситуацію"></textarea>

<label>Чи було залякування з боку адміністрації?</label>
<select id="intimidation">
  <option value="yes">Так</option>
  <option value="no">Ні</option>
</select>
<textarea id="intimidationDesc" placeholder="Опишіть ситуацію"></textarea>
</div>

<!-- STEP 6 -->
<div class="step">
<h2>В’язниця та умови</h2>

<label>Оберіть ZPKZ</label>
<select id="prisonName">
<option value="ZPKZ Ljubljana">ZPKZ Ljubljana</option>
<option value="ZPKZ Dob pri Mirni">ZPKZ Dob pri Mirni</option>
<option value="ZPKZ Celje">ZPKZ Celje</option>
<option value="ZPKZ Maribor">ZPKZ Maribor</option>
</select>

<label>Період перебування – від</label><input type="date" id="prisonFrom">
<label>до</label><input type="date" id="prisonTo">

<label>Чи платили ви за ліки?</label>
<select id="medsPaid">
  <option value="yes">Так</option>
  <option value="no">Ні</option>
</select>
<textarea id="medsDesc" placeholder="Деталі"></textarea>

<label>Чи проводилися медичні тести?</label>
<select id="tests">
  <option value="yes">Так</option>
  <option value="no">Ні</option>
</select>
<textarea id="testsDesc" placeholder="Деталі"></textarea>

<h3>Камери</h3>
<div id="cells"></div>
<button type="button" onclick="addCell()">➕ Додати камеру</button>
</div>

<!-- STEP 7 -->
<div class="step">
<h2>Попередній перегляд JSON</h2>
<div class="preview" id="preview"></div>
<button type="button" onclick="downloadTXT()">Зберегти TXT</button>
<button type="button" onclick="downloadPDF()">Зберегти PDF</button>
<button type="button" onclick="sendMail()">Надіслати EMAIL</button>
</div>

<div>
<button type="button" onclick="prev()">Назад</button>
<button type="button" onclick="next()">Далі</button>
</div>

</form>
</div>

<script>
let step=0;
const steps=document.querySelectorAll(".step");

function showStep(){
  steps.forEach((s,i)=>s.classList.toggle("active",i===step));
  document.getElementById("progressBar").style.width=((step+1)/steps.length*100)+"%";
  if(step===steps.length-1) buildPreview();
}
function next(){ if(step<steps.length-1){step++;showStep();}}
function prev(){ if(step>0){step--;showStep();}}

let cellCounter=0;
function addCell(){
  cellCounter++;
  const d=document.createElement("div");
  d.className="box";
  d.innerHTML=`
<h4>Камера ${cellCounter}</h4>

<label>Додаткові проблеми (можна обрати кілька)</label>
<div data-notes-group="${cellCounter}">
<label><input type="checkbox" value="mold"> гриб / пліснява</label>
<label><input type="checkbox" value="no_ventilation"> відсутня вентиляція</label>
<label><input type="checkbox" value="high_temperature"> висока температура</label>
<label><input type="checkbox" value="bad_smell"> неприємний запах</label>
<label><input type="checkbox" value="drugs"> наркотики</label>
<label><input type="checkbox" value="no_non_smoking_area"> відсутня зона для некурців</label>
<label><input type="checkbox" value="infectious_diseases"> заразні хвороби</label>
</div>
`;
  document.getElementById("cells").appendChild(d);
}

function collect(){
  const cells=[];
  document.querySelectorAll("#cells .box").forEach((c,i)=>{
    const idx=i+1;
    cells.push({
      cell_number: idx,
      notes: Array.from(c.querySelectorAll(`[data-notes-group="${idx}"] input:checked`))
        .map(cb=>cb.value)
    });
  });

  return {
    firstName:firstName.value,
    lastName:lastName.value,
    address:address.value,
    phone:phone.value,
    email:email.value,
    caseNo:caseNo.value,
    judgmentDate:judgmentDate.value,
    courtCity:courtCity.value,
    language:languageUnderstood.value,
    regulations:regulations.value,
    blackmail:blackmail.value,
    blackmailDesc:blackmailDesc.value,
    intimidation:intimidation.value,
    intimidationDesc:intimidationDesc.value,
    prison:{
      name:prisonName.value,
      from:prisonFrom.value,
      to:prisonTo.value,
      medsPaid:medsPaid.value,
      medsDesc:medsDesc.value,
      tests:tests.value,
      testsDesc:testsDesc.value,
      cells:cells
    }
  };
}

function buildPreview(){
  preview.textContent=JSON.stringify(collect(),null,2);
}

function downloadTXT(){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([preview.textContent]));
  a.download="prison_ua.json.txt";
  a.click();
}

function downloadPDF(){
  const {jsPDF}=window.jspdf;
  const d=new jsPDF();
  d.text(preview.textContent,10,10);
  d.save("prison_ua.pdf");
}

function sendMail(){
  window.location.href="mailto:yourmail@domain.ua?subject=Prison Justice UA&body="+encodeURIComponent(preview.textContent);
}

showStep();
</script>
</body>
</html>
