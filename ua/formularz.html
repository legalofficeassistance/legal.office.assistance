<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prison Justice – Client Form</title>
<meta name="description" content="Client form for prison condition cases. Data saved in unified JSON format.">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {font-family:Arial, sans-serif; background:#f2f2f2; margin:0;}
.container {max-width:900px; background:#fff; margin:20px auto; padding:20px; border-radius:6px;}
.step {display:none;}
.step.active {display:block;}
label {display:block; margin-top:10px; font-weight:bold;}
input, textarea, select {width:100%; padding:8px; margin-top:4px;}
textarea {min-height:60px;}
button {padding:10px 15px; margin-top:15px; cursor:pointer;}
.progress {height:8px; background:#ddd; margin-bottom:20px;}
.progress-bar {height:8px; background:#2a8f3a; width:0%;}
.preview {white-space:pre-wrap; background:#f9f9f9; padding:12px;}
.top {display:flex; justify-content:space-between;}
a {text-decoration:none; color:#003366; font-weight:bold;}
</style>
</head>

<body>

<div class="container">

<div class="top">
  <a href="index.html">← Home</a>
  <select id="langSelect">
    <option value="pl">PL</option>
    <option value="en">EN</option>
    <option value="ru">RU</option>
    <option value="ua">UA</option>
    <option value="ro">RO</option>
    <option value="md">MD</option>
  </select>
</div>

<div class="progress"><div class="progress-bar" id="progressBar"></div></div>

<form id="form">

<div class="step active">
  <h2 data-i18n="personal">Dane osobowe</h2>
  <label data-i18n="firstName">Imię</label><input id="firstName">
  <label data-i18n="lastName">Nazwisko</label><input id="lastName">
  <label data-i18n="address">Adres</label><textarea id="address"></textarea>
</div>

<div class="step">
  <h2 data-i18n="contact">Kontakt</h2>
  <label data-i18n="phone">Telefon</label><input id="phone">
  <label>Email</label><input id="email">
</div>

<div class="step">
  <h2 data-i18n="language">Język i regulamin</h2>

  <label data-i18n="descLang">Język opisu</label>
  <select id="languageUnderstood">
    <option value="pl">PL</option>
    <option value="en">EN</option>
    <option value="ru">RU</option>
    <option value="ua">UA</option>
    <option value="ro">RO</option>
    <option value="md">MD</option>
  </select>

  <label data-i18n="rules">Czy otrzymałeś regulamin?</label>
  <select id="regulations">
    <option value="yes" data-i18n="yes">Tak</option>
    <option value="no" data-i18n="no">Nie</option>
  </select>
</div>

<div class="step">
  <h2>JSON</h2>
  <div class="preview" id="preview"></div>
  <button type="button" onclick="downloadTXT()">TXT</button>
  <button type="button" onclick="downloadPDF()">PDF</button>
</div>

<div>
  <button type="button" onclick="prev()">←</button>
  <button type="button" onclick="next()">→</button>
</div>

</form>
</div>

<script>
/* ===== LANGUAGE ===== */
const dict = {
pl:{
personal:"Dane osobowe",firstName:"Imię",lastName:"Nazwisko",address:"Adres",
contact:"Kontakt",phone:"Telefon",
language:"Język i regulamin",descLang:"Język opisu",rules:"Czy otrzymałeś regulamin?",
yes:"Tak",no:"Nie"
},
en:{
personal:"Personal data",firstName:"First name",lastName:"Last name",address:"Address",
contact:"Contact",phone:"Phone",
language:"Language & rules",descLang:"Description language",rules:"Did you receive regulations?",
yes:"Yes",no:"No"
},
ru:{
personal:"Личные данные",firstName:"Имя",lastName:"Фамилия",address:"Адрес",
contact:"Контакты",phone:"Телефон",
language:"Язык и правила",descLang:"Язык описания",rules:"Вы получили правила?",
yes:"Да",no:"Нет"
},
ua:{
personal:"Особисті дані",firstName:"Ім’я",lastName:"Прізвище",address:"Адреса",
contact:"Контакти",phone:"Телефон",
language:"Мова і правила",descLang:"Мова опису",rules:"Ви отримали правила?",
yes:"Так",no:"Ні"
},
ro:{
personal:"Date personale",firstName:"Prenume",lastName:"Nume",address:"Adresă",
contact:"Contact",phone:"Telefon",
language:"Limbă și reguli",descLang:"Limba descrierii",rules:"Ați primit regulamentul?",
yes:"Da",no:"Nu"
},
md:{
personal:"Date personale",firstName:"Prenume",lastName:"Nume",address:"Adresă",
contact:"Contact",phone:"Telefon",
language:"Limbă și reguli",descLang:"Limba descrierii",rules:"Ați primit regulamentul?",
yes:"Da",no:"Nu"
}
};

const params = new URLSearchParams(location.search);
let lang = params.get("lang") || "pl";
document.getElementById("langSelect").value = lang;

function applyLang(){
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    el.textContent = dict[lang][el.dataset.i18n];
  });
}
applyLang();

document.getElementById("langSelect").onchange=e=>{
  lang=e.target.value;
  applyLang();
};

/* ===== FORM ===== */
let step=0;
const steps=document.querySelectorAll(".step");

function showStep(){
  steps.forEach((s,i)=>s.classList.toggle("active",i===step));
  document.getElementById("progressBar").style.width=((step+1)/steps.length*100)+"%";
  if(step===steps.length-1) preview.textContent=JSON.stringify(collect(),null,2);
}
function next(){ if(step<steps.length-1){step++;showStep();}}
function prev(){ if(step>0){step--;showStep();}}

function collect(){
  return{
    firstName:firstName.value,
    lastName:lastName.value,
    address:address.value,
    phone:phone.value,
    email:email.value,
    descriptionLanguage:languageUnderstood.value,
    regulations:regulations.value
  };
}

function downloadTXT(){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([preview.textContent]));
  a.download="prison.json.txt";a.click();
}

function downloadPDF(){
  const {jsPDF}=window.jspdf;
  const d=new jsPDF();
  d.text(preview.textContent,10,10);
  d.save("prison.pdf");
}

showStep();
</script>

</body>
</html>
