<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Client Form – Prison Justice EN</title>
<meta name="description" content="Prison Justice EN client form for describing prison conditions in Slovenia.">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {font-family:Arial,sans-serif;background:#f2f2f2;margin:0;}
.container {max-width:900px;background:#fff;margin:20px auto;padding:20px;border-radius:6px;}
.step{display:none;}
.step.active{display:block;}
label{display:block;margin-top:10px;font-weight:bold;}
input,textarea,select{width:100%;padding:8px;margin-top:4px;}
textarea{min-height:60px;}
button{padding:10px 15px;margin-top:15px;cursor:pointer;}
.box{border:1px solid #ccc;padding:12px;margin-top:15px;border-radius:4px;}
.progress{height:8px;background:#ddd;border-radius:4px;margin-bottom:20px;}
.progress-bar{height:8px;background:#2a8f3a;width:0%;border-radius:4px;}
.preview{white-space:pre-wrap;background:#f9f9f9;padding:12px;}
.warning{color:red;font-weight:bold;margin-top:15px;}
.top-nav{margin-bottom:15px;}
.back-home{color:#003366;font-weight:bold;text-decoration:none;}
</style>
</head>

<body>
<div class="container">

<div class="top-nav">
  <a href="index.html" class="back-home">← Back to homepage</a>
</div>

<div class="progress"><div class="progress-bar" id="progressBar"></div></div>

<form id="form">

<!-- STEP 1 -->
<div class="step active">
<h2>Personal Details</h2>

<label>First name</label><input id="firstName">
<label>Last name</label><input id="lastName">

<label>Street</label><input id="street">
<label>House number</label><input id="houseNo">
<label>Apartment number</label><input id="flatNo">
<label>Postal code</label><input id="postalCode">
<label>City</label><input id="city">
<label>Country</label><input id="country">
</div>

<!-- STEP 2 -->
<div class="step">
<h2>Contact Information</h2>
<label>Phone number</label><input id="phone">
<label>Email</label><input id="email">
</div>

<!-- STEP 3 -->
<div class="step">
<h2>Case Details</h2>

<label>Judgment reference number (based on which you served your sentence in Slovenia)</label>
<input id="caseNo">

<label>Date of judgment</label>
<input type="date" id="judgmentDate">

<label>City of the sentencing court</label>
<input id="courtCity">
</div>

<!-- STEP 4 -->
<div class="step">
<h2>Language and Prison Regulations</h2>

<label>Language you speak (native / understood)</label>
<input id="descriptionLanguage">

<label>Did you receive the prison regulations?</label>
<select id="regulations">
  <option value="yes">Yes</option>
  <option value="no">No</option>
</select>
</div>

<!-- STEP 5 -->
<div class="step">
<h2>Blackmail and Intimidation</h2>

<label>Were you blackmailed by the prosecutor?</label>
<select id="blackmail">
  <option value="yes">Yes</option>
  <option value="no">No</option>
</select>
<textarea id="blackmailDesc" placeholder="Description"></textarea>

<label>Were you intimidated by the prison administration?</label>
<select id="intimidation">
  <option value="yes">Yes</option>
  <option value="no">No</option>
</select>
<textarea id="intimidationDesc" placeholder="Description"></textarea>
</div>

<!-- STEP 6 -->
<div class="step">
<h2>Prison and Cells</h2>

<label>Prison facility</label>
<select id="prisonName">
  <option>ZPKZ Ljubljana</option>
  <option>ZPKZ Dob pri Mirni</option>
  <option>ZPKZ Celje</option>
  <option>ZPKZ Maribor</option>
  <option>ZPKZ Novo Mesto</option>
  <option>ZPKZ Koper</option>
</select>

<label>Stay from</label><input type="date" id="prisonFrom">
<label>Stay to</label><input type="date" id="prisonTo">

<h3>Cells</h3>
<div id="cells"></div>
<button type="button" onclick="addCell()">➕ Add another cell</button>
</div>

<!-- STEP 7 -->
<div class="step">
<h2>JSON Preview</h2>
<div class="preview" id="preview"></div>

<div class="warning">
Descriptions remain in the client’s original language.
</div>

<button type="button" onclick="downloadTXT()">TXT</button>
<button type="button" onclick="downloadPDF()">PDF</button>
<button type="button" onclick="sendMail()">EMAIL</button>

<br><br>
<a href="index.html" class="back-home">← Back to homepage</a>
</div>

<div>
<button type="button" onclick="prev()">Back</button>
<button type="button" onclick="next()">Next</button>
</div>

</form>
</div>

<script>
let step=0;
const steps=document.querySelectorAll(".step");

function showStep(){
  steps.forEach((s,i)=>s.classList.toggle("active",i===step));
  document.getElementById("progressBar").style.width=((step+1)/steps.length*100)+"%";
  if(step===steps.length-1) buildPreview();
}
function next(){if(step<steps.length-1){step++;showStep();}}
function prev(){if(step>0){step--;showStep();}}

let cellCounter=0;
function addCell(){
  cellCounter++;
  const d=document.createElement("div");
  d.className="box";
  d.innerHTML=`
<h4>Cell ${cellCounter}</h4>

<label>Cell number</label>
<input data-field="cellNo_${cellCounter}">

<label>Stay from</label>
<input type="date" data-field="from_${cellCounter}">
<label>Stay to</label>
<input type="date" data-field="to_${cellCounter}">

<label>Cell capacity (number of persons it was designed for)</label>
<input data-field="people_${cellCounter}">

<label>Size (approx.)</label>
<input data-field="size_${cellCounter}">

<label>Problems</label>
<div data-notes-group="${cellCounter}">
<label><input type="checkbox" value="mold"> mold / mildew</label>
<label><input type="checkbox" value="no_ventilation"> no ventilation</label>
<label><input type="checkbox" value="high_temperature"> high temperature</label>
<label><input type="checkbox" value="bad_smell"> unpleasant smell</label>
<label><input type="checkbox" value="drugs"> drugs</label>
<label><input type="checkbox" value="infectious_diseases"> infectious diseases</label>
</div>
`;
  document.getElementById("cells").appendChild(d);
}

function collect(){
  const cells=[];
  document.querySelectorAll("#cells .box").forEach((c,i)=>{
    const idx=i+1;
    cells.push({
      cellNo:c.querySelector(`[data-field="cellNo_${idx}"]`).value,
      from:c.querySelector(`[data-field="from_${idx}"]`).value,
      to:c.querySelector(`[data-field="to_${idx}"]`).value,
      people:c.querySelector(`[data-field="people_${idx}"]`).value,
      size:c.querySelector(`[data-field="size_${idx}"]`).value,
      notes:Array.from(
        c.querySelectorAll(`[data-notes-group="${idx}"] input:checked`)
      ).map(cb=>cb.value)
    });
  });

  return {
    firstName:firstName.value,
    lastName:lastName.value,
    address:{
      street:street.value,
      houseNo:houseNo.value,
      flatNo:flatNo.value,
      postalCode:postalCode.value,
      city:city.value,
      country:country.value
    },
    phone:phone.value,
    email:email.value,
    caseNo:caseNo.value,
    judgmentDate:judgmentDate.value,
    courtCity:courtCity.value,
    descriptionLanguage:descriptionLanguage.value,
    regulations:regulations.value,
    blackmail:blackmail.value,
    blackmailDesc:blackmailDesc.value,
    intimidation:intimidation.value,
    intimidationDesc:intimidationDesc.value,
    prison:{
      name:prisonName.value,
      from:prisonFrom.value,
      to:prisonTo.value,
      cells:cells
    }
  };
}

function buildPreview(){
  preview.textContent=JSON.stringify(collect(),null,2);
}

function downloadTXT(){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([preview.textContent]));
  a.download="prison_en.json.txt";
  a.click();
}

function downloadPDF(){
  const {jsPDF}=window.jspdf;
  const d=new jsPDF();
  d.text(preview.textContent,10,10);
  d.save("prison_en.pdf");
}

function sendMail(){
  window.location.href="mailto:contact@prison-justice.pl?subject=Prison Justice EN&body="+encodeURIComponent(preview.textContent);
}

showStep();
</script>

</body>
</html>
