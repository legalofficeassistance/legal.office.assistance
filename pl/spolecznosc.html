<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Społeczność – Prison Justice</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { font-family: Arial,sans-serif; background:#f4f4f4; margin:0;}
header{background:#003366;color:white;padding:15px;}
.flags img{width:28px;cursor:pointer;margin-right:5px;}
main{max-width:900px;margin:20px auto;background:white;padding:20px;}
.post{border-bottom:1px solid #ddd;padding:12px;}
.tag{background:#eee;padding:3px 8px;margin-right:6px;}
.post-form input,.post-form textarea,.post-form select{width:100%;padding:8px;margin-bottom:10px;}
.post-form button{background:#003366;color:white;border:none;padding:10px 20px;}
#captchaBox{background:#eee;padding:10px;margin:10px 0;font-weight:bold;}
</style>
  <link rel="alternate" hreflang="pl" href="https://prison-justice.pl/pl/privacy-policy.html" />
<link rel="alternate" hreflang="uk" href="https://prison-justice.pl/ua/privacy-policy.html" />
<link rel="alternate" hreflang="ru" href="https://prison-justice.pl/ru/privacy-policy.html" />
<link rel="alternate" hreflang="en" href="https://prison-justice.pl/en/privacy-policy.html" />
<link rel="alternate" hreflang="ro" href="https://prison-justice.pl/ro/privacy-policy.html" />
<link rel="alternate" hreflang="x-default" href="https://prison-justice.pl/" />
</head>

<body>

<header>
<h1>Prison Justice – Społeczność</h1>
<div class="flags">
<img src="pl.png" data-lang="pl">
<img src="en.png" data-lang="en">
<img src="ru.png" data-lang="ru">
<img src="ua.png" data-lang="ua">
<img src="ro.png" data-lang="ro">
<img src="md.png" data-lang="md">
</div>
</header>

<main>
<h2 id="title">Społeczność</h2>

<form id="postForm" class="post-form">
<input name="title" placeholder="Tytuł" required>

<select name="category" id="categorySelect" required></select>

<textarea name="content" placeholder="Treść" required></textarea>

<div id="captchaBox"></div>
<input id="captchaInput" placeholder="Wpisz wynik" required>

<button>Dodaj wpis</button>
</form>

<hr>
<div id="posts"></div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyAmni7Eu_oRaFI9kDwLiFvOZ1lXXE--8YY",
authDomain:"prison-justice-pl-community.firebaseapp.com",
projectId:"prison-justice-pl-community"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const texts={
pl:{cats:["Prawa","Warunki","Zdrowie","Prawo","Rodzina","Inne"]},
en:{cats:["Rights","Conditions","Health","Law","Family","Other"]},
ru:{cats:["Права","Условия","Здоровье","Закон","Семья","Другое"]},
ua:{cats:["Права","Умови","Здоров’я","Закон","Сім'я","Інше"]},
ro:{cats:["Drepturi","Condiții","Sănătate","Lege","Familie","Altele"]},
md:{cats:["Drepturi","Condiții","Sănătate","Lege","Familie","Altele"]}
};

let lang="pl";
const catSel=document.getElementById("categorySelect");

function loadCats(){
catSel.innerHTML="";
texts[lang].cats.forEach(c=>{
let o=document.createElement("option");
o.value=c;o.textContent=c;catSel.appendChild(o);
});
}
loadCats();

document.querySelectorAll(".flags img").forEach(i=>{
i.onclick=()=>{lang=i.dataset.lang;loadCats();}
});

// CAPTCHA
let a=Math.floor(Math.random()*10)+1;
let b=Math.floor(Math.random()*10)+1;
document.getElementById("captchaBox").innerText=`${a} + ${b} = ?`;

const postsDiv=document.getElementById("posts");
const postsCol=collection(db,"posts");

async function translate(txt,to){
if(to==="pl") return txt;
const r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(txt)}&langpair=pl|${to}`);
const j=await r.json();
return j.responseData.translatedText;
}

onSnapshot(query(postsCol,orderBy("date","desc")),async snap=>{
postsDiv.innerHTML="";
for(const d of snap.docs){
const data=d.data();
const title=await translate(data.title,lang);
const cont=await translate(data.content,lang);
postsDiv.innerHTML+=`<div class="post">
<b>${title}</b> <span class="tag">${data.category}</span>
<p>${cont}</p>
</div>`;
}
});

document.getElementById("postForm").onsubmit=async e=>{
e.preventDefault();
if(parseInt(document.getElementById("captchaInput").value)!==a+b){alert("Zły wynik");return;}
const f=new FormData(e.target);
await addDoc(postsCol,{
title:f.get("title"),
content:f.get("content"),
category:f.get("category"),
date:new Date()
});
e.target.reset();
location.reload();
};
</script>

</body>
</html>
