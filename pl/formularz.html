<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Formularz klienta – Prison Justice PL</title>
<meta name="description" content="Formularz Prison Justice PL do opisu warunków odbywania kary pozbawienia wolności w Słowenii.">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {font-family:Arial,sans-serif;background:#f2f2f2;margin:0;}
.container {max-width:900px;background:#fff;margin:20px auto;padding:20px;border-radius:6px;}
.step{display:none;}
.step.active{display:block;}
label{display:block;margin-top:10px;font-weight:bold;}
input,textarea,select{width:100%;padding:8px;margin-top:4px;}
textarea{min-height:60px;}
button{padding:10px 15px;margin-top:15px;cursor:pointer;}
.box{border:1px solid #ccc;padding:12px;margin-top:15px;border-radius:4px;}
.progress{height:8px;background:#ddd;border-radius:4px;margin-bottom:20px;}
.progress-bar{height:8px;background:#2a8f3a;width:0%;border-radius:4px;}
.preview{white-space:pre-wrap;background:#f9f9f9;padding:12px;}
.warning{color:red;font-weight:bold;margin-top:15px;}
.top-nav{margin-bottom:15px;}
.back-home{color:#003366;font-weight:bold;text-decoration:none;}
</style>
</head>

<body>
<div class="container">

<div class="top-nav">
  <a href="index.html" class="back-home">← Powrót do strony głównej</a>
</div>

<div class="progress"><div class="progress-bar" id="progressBar"></div></div>

<form id="form">

<!-- STEP 1 -->
<div class="step active">
<h2>Dane osobowe</h2>

<label>Imię</label><input id="firstName">
<label>Nazwisko</label><input id="lastName">

<label>Ulica</label><input id="street">
<label>Numer domu</label><input id="houseNo">
<label>Numer mieszkania</label><input id="flatNo">
<label>Kod pocztowy</label><input id="postalCode">
<label>Miasto</label><input id="city">
<label>Kraj</label><input id="country">
</div>

<!-- STEP 2 -->
<div class="step">
<h2>Kontakt</h2>
<label>Telefon</label><input id="phone">
<label>Email</label><input id="email">
</div>

<!-- STEP 3 -->
<div class="step">
<h2>Dane sprawy</h2>

<label>Sygnatura wyroku (na podstawie którego odbywałeś karę w Słowenii)</label>
<input id="caseNo">

<label>Data wyroku</label>
<input type="date" id="judgmentDate">

<label>Miasto sądu skazującego</label>
<input id="courtCity">
</div>

<!-- STEP 4 -->
<div class="step">
<h2>Język i regulamin</h2>

<label>Język, którym władasz (ojczysty / rozumiany)</label>
<input id="descriptionLanguage">

<label>Czy otrzymałeś regulamin więzienny?</label>
<select id="regulations">
  <option value="yes">Tak</option>
  <option value="no">Nie</option>
</select>
</div>

<!-- STEP 5 -->
<div class="step">
<h2>Szantaż i zastraszanie</h2>

<label>Czy byłeś szantażowany przez prokuratora?</label>
<select id="blackmail">
  <option value="yes">Tak</option>
  <option value="no">Nie</option>
</select>
<textarea id="blackmailDesc" placeholder="Opis"></textarea>

<label>Czy byłeś zastraszany przez administrację więzienia?</label>
<select id="intimidation">
  <option value="yes">Tak</option>
  <option value="no">Nie</option>
</select>
<textarea id="intimidationDesc" placeholder="Opis"></textarea>
</div>

<!-- STEP 6 -->
<div class="step">
<h2>Więzienie i cele</h2>

<label>Zakład karny</label>
<select id="prisonName">
  <option>ZPKZ Ljubljana</option>
  <option>ZPKZ Dob pri Mirni</option>
  <option>ZPKZ Celje</option>
  <option>ZPKZ Maribor</option>
  <option>ZPKZ Novo Mesto</option>
  <option>ZPKZ Koper</option>
</select>

<label>Pobyt od</label><input type="date" id="prisonFrom">
<label>Pobyt do</label><input type="date" id="prisonTo">

<h3>Cele</h3>
<div id="cells"></div>
<button type="button" onclick="addCell()">➕ Dodaj kolejną celę</button>
</div>

<!-- STEP 7 -->
<div class="step">
<h2>Podgląd JSON</h2>
<div class="preview" id="preview"></div>

<div class="warning">
Opisy pozostają w oryginalnym języku klienta.
</div>

<button type="button" onclick="downloadTXT()">TXT</button>
<button type="button" onclick="downloadPDF()">PDF</button>
<button type="button" onclick="sendMail()">EMAIL</button>

<br><br>
<a href="index.html" class="back-home">← Powrót do strony głównej</a>
</div>

<div>
<button type="button" onclick="prev()">Wstecz</button>
<button type="button" onclick="next()">Dalej</button>
</div>

</form>
</div>

<script>
let step=0;
const steps=document.querySelectorAll(".step");

function showStep(){
  steps.forEach((s,i)=>s.classList.toggle("active",i===step));
  document.getElementById("progressBar").style.width=((step+1)/steps.length*100)+"%";
  if(step===steps.length-1) buildPreview();
}
function next(){if(step<steps.length-1){step++;showStep();}}
function prev(){if(step>0){step--;showStep();}}

let cellCounter=0;
function addCell(){
  cellCounter++;
  const d=document.createElement("div");
  d.className="box";
  d.innerHTML=`
<h4>Cela ${cellCounter}</h4>

<label>Numer celi</label>
<input data-field="cellNo_${cellCounter}">

<label>Pobyt od</label>
<input type="date" data-field="from_${cellCounter}">
<label>Pobyt do</label>
<input type="date" data-field="to_${cellCounter}">

<label>Ilo osobowa była cela (na ile osób była przeznaczona)</label>
<input data-field="people_${cellCounter}">

<label>Metraż (orientacyjnie)</label>
<input data-field="size_${cellCounter}">

<label>Problemy</label>
<div data-notes-group="${cellCounter}">
<label><input type="checkbox" value="mold"> grzyb / pleśń</label>
<label><input type="checkbox" value="no_ventilation"> brak wentylacji</label>
<label><input type="checkbox" value="high_temperature"> wysoka temperatura</label>
<label><input type="checkbox" value="bad_smell"> nieprzyjemny zapach</label>
<label><input type="checkbox" value="drugs"> narkotyki</label>
<label><input type="checkbox" value="infectious_diseases"> choroby zakaźne</label>
</div>
`;
  document.getElementById("cells").appendChild(d);
}

function collect(){
  const cells=[];
  document.querySelectorAll("#cells .box").forEach((c,i)=>{
    const idx=i+1;
    cells.push({
      cellNo:c.querySelector(`[data-field="cellNo_${idx}"]`).value,
      from:c.querySelector(`[data-field="from_${idx}"]`).value,
      to:c.querySelector(`[data-field="to_${idx}"]`).value,
      people:c.querySelector(`[data-field="people_${idx}"]`).value,
      size:c.querySelector(`[data-field="size_${idx}"]`).value,
      notes:Array.from(
        c.querySelectorAll(`[data-notes-group="${idx}"] input:checked`)
      ).map(cb=>cb.value)
    });
  });

  return {
    firstName:firstName.value,
    lastName:lastName.value,
    address:{
      street:street.value,
      houseNo:houseNo.value,
      flatNo:flatNo.value,
      postalCode:postalCode.value,
      city:city.value,
      country:country.value
    },
    phone:phone.value,
    email:email.value,
    caseNo:caseNo.value,
    judgmentDate:judgmentDate.value,
    courtCity:courtCity.value,
    descriptionLanguage:descriptionLanguage.value,
    regulations:regulations.value,
    blackmail:blackmail.value,
    blackmailDesc:blackmailDesc.value,
    intimidation:intimidation.value,
    intimidationDesc:intimidationDesc.value,
    prison:{
      name:prisonName.value,
      from:prisonFrom.value,
      to:prisonTo.value,
      cells:cells
    }
  };
}

function buildPreview(){
  preview.textContent=JSON.stringify(collect(),null,2);
}

function downloadTXT(){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([preview.textContent]));
  a.download="prison_pl.json.txt";
  a.click();
}

function downloadPDF(){
  const {jsPDF}=window.jspdf;
  const d=new jsPDF();
  d.text(preview.textContent,10,10);
  d.save("prison_pl.pdf");
}

function sendMail(){
  window.location.href="mailto:contact@prison-justice.pl?subject=Prison Justice PL&body="+encodeURIComponent(preview.textContent);
}

showStep();
</script>

</body>
</html>
