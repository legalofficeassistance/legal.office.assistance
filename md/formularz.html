<!DOCTYPE html>
<html lang="md">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Formular Prison Justice Moldova – condiții proaste de detenție</title>

<meta name="description" content="Formular oficial Prison Justice pentru cetățeni din Republica Moldova. Condiții proaste în închisorile din Slovenia, despăgubiri, CEDO Strasbourg, asistență juridică.">

<meta name="keywords" content="
condiții proaste detenție,
închisori Slovenia,
despăgubiri deținuți,
CEDO Strasbourg,
drepturile omului,
tratament inuman,
Prison Justice Moldova,
asistență juridică penitenciar
">

<meta name="robots" content="index, follow">
<meta name="geo.region" content="MD">
<meta name="geo.placename" content="Moldova">
<meta name="language" content="ro">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {font-family:Arial, sans-serif; background:#f2f2f2; margin:0;}
.container {max-width:900px; background:#fff; margin:20px auto; padding:20px; border-radius:6px;}
.step {display:none;}
.step.active {display:block;}
label {display:block; margin-top:10px; font-weight:bold;}
input, textarea, select {width:100%; padding:8px; margin-top:4px;}
textarea {min-height:60px;}
button {padding:10px 15px; margin-top:15px; cursor:pointer;}
.box {border:1px solid #ccc; padding:12px; margin-top:15px; border-radius:4px;}
.progress {height:8px; background:#ddd; border-radius:4px; margin-bottom:20px;}
.progress-bar {height:8px; background:#2a8f3a; width:0%; border-radius:4px;}
.preview {white-space:pre-wrap; background:#f9f9f9; padding:12px;}
.warning {color:red; font-weight:bold; margin-top:15px;}
</style>
</head>

<body>
<div class="container">

<div class="progress"><div class="progress-bar" id="progressBar"></div></div>

<form id="form">

<!-- STEP 1 -->
<div class="step active">
<h2>Date personale</h2>
<label>Prenume</label><input id="firstName">
<label>Nume</label><input id="lastName">
<label>Adresă completă</label><textarea id="address"></textarea>
</div>

<!-- STEP 2 -->
<div class="step">
<h2>Contact</h2>
<label>Telefon</label><input id="phone">
<label>Email</label><input id="email">
</div>

<!-- STEP 3 -->
<div class="step">
<h2>Datele cauzei</h2>
<label>Numărul sentinței</label><input id="caseNo">
<label>Data sentinței</label><input type="date" id="judgmentDate">
<label>Orașul instanței</label><input id="courtCity">
</div>

<!-- STEP 4 -->
<div class="step">
<h2>Limbă și regulament</h2>
<label>Limba în care ați înțeles regulamentul</label>
<input id="languageUnderstood">

<label>Ați primit regulamentul?</label>
<select id="regulations">
  <option value="yes">Da</option>
  <option value="no">Nu</option>
</select>
</div>

<!-- STEP 5 -->
<div class="step">
<h2>Presiuni și intimidare</h2>

<label>Ați fost șantajat de procuror?</label>
<select id="blackmail">
  <option value="yes">Da</option>
  <option value="no">Nu</option>
</select>
<textarea id="blackmailDesc" placeholder="Descriere"></textarea>

<label>Ați fost intimidat de administrația penitenciarului?</label>
<select id="intimidation">
  <option value="yes">Da</option>
  <option value="no">Nu</option>
</select>
<textarea id="intimidationDesc" placeholder="Descriere"></textarea>
</div>

<!-- STEP 6 -->
<div class="step">
<h2>Penitenciar și condiții</h2>

<label>Selectați ZPKZ</label>
<select id="prisonName">
<option value="ZPKZ Ljubljana">ZPKZ Ljubljana</option>
<option value="ZPKZ Dob pri Mirni">ZPKZ Dob pri Mirni</option>
<option value="ZPKZ Celje">ZPKZ Celje</option>
<option value="ZPKZ Maribor">ZPKZ Maribor</option>
</select>

<label>Perioada detenției – de la</label>
<input type="date" id="prisonFrom">
<label>până la</label>
<input type="date" id="prisonTo">

<label>Ați plătit pentru medicamente?</label>
<select id="medsPaid">
  <option value="yes">Da</option>
  <option value="no">Nu</option>
</select>
<textarea id="medsDesc"></textarea>

<label>S-au efectuat teste medicale (HIV/HCV)?</label>
<select id="tests">
  <option value="yes">Da</option>
  <option value="no">Nu</option>
</select>
<textarea id="testsDesc"></textarea>

<h3>Celule</h3>
<div id="cells"></div>
<button type="button" onclick="addCell()">➕ Adaugă celulă</button>
</div>

<!-- STEP 7 -->
<div class="step">
<h2>Previzualizare JSON</h2>
<div class="preview" id="preview"></div>
<div class="warning">
Pentru fiecare penitenciar este necesar un formular separat.
</div>
<button type="button" onclick="downloadTXT()">TXT</button>
<button type="button" onclick="downloadPDF()">PDF</button>
<button type="button" onclick="sendMail()">EMAIL</button>
</div>

<div>
<button type="button" onclick="prev()">Înapoi</button>
<button type="button" onclick="next()">Înainte</button>
</div>

</form>
</div>

<script>
let step=0;
const steps=document.querySelectorAll(".step");

function showStep(){
  steps.forEach((s,i)=>s.classList.toggle("active",i===step));
  document.getElementById("progressBar").style.width=((step+1)/steps.length*100)+"%";
  if(step===steps.length-1) buildPreview();
}
function next(){ if(step<steps.length-1){step++;showStep();}}
function prev(){ if(step>0){step--;showStep();}}

let cellCounter=0;
function addCell(){
  cellCounter++;
  const d=document.createElement("div");
  d.className="box";
  d.innerHTML=`
<h4>Celula ${cellCounter}</h4>
<label>Probleme suplimentare</label>
<div data-notes-group="${cellCounter}">
<label><input type="checkbox" value="mold"> mucegai</label>
<label><input type="checkbox" value="no_ventilation"> lipsa ventilației</label>
<label><input type="checkbox" value="high_temperature"> temperatură ridicată</label>
<label><input type="checkbox" value="bad_smell"> miros neplăcut</label>
<label><input type="checkbox" value="drugs"> droguri</label>
<label><input type="checkbox" value="no_non_smoking_area"> lipsa zonei pentru nefumători</label>
<label><input type="checkbox" value="infectious_diseases"> boli infecțioase</label>
</div>
`;
  document.getElementById("cells").appendChild(d);
}

function collect(){
  const cells=[];
  document.querySelectorAll("#cells .box").forEach((c,i)=>{
    const idx=i+1;
    cells.push({
      cell_number: idx,
      notes: Array.from(
        c.querySelectorAll(`[data-notes-group="${idx}"] input:checked`)
      ).map(cb=>cb.value)
    });
  });

  return {
    firstName:firstName.value,
    lastName:lastName.value,
    address:address.value,
    phone:phone.value,
    email:email.value,
    caseNo:caseNo.value,
    judgmentDate:judgmentDate.value,
    courtCity:courtCity.value,
    language:languageUnderstood.value,
    regulations:regulations.value,
    blackmail:blackmail.value,
    blackmailDesc:blackmailDesc.value,
    intimidation:intimidation.value,
    intimidationDesc:intimidationDesc.value,
    prison:{
      name:prisonName.value,
      from:prisonFrom.value,
      to:prisonTo.value,
      medsPaid:medsPaid.value,
      medsDesc:medsDesc.value,
      tests:tests.value,
      testsDesc:testsDesc.value,
      cells:cells
    }
  };
}

function buildPreview(){
  preview.textContent=JSON.stringify(collect(),null,2);
}

function downloadTXT(){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([preview.textContent]));
  a.download="prison_md.json.txt";
  a.click();
}

function downloadPDF(){
  const {jsPDF}=window.jspdf;
  const d=new jsPDF();
  d.text(preview.textContent,10,10);
  d.save("prison_md.pdf");
}

function sendMail(){
  window.location.href="mailto:yourmail@domain.md?subject=Prison Justice Moldova&body="+encodeURIComponent(preview.textContent);
}

showStep();
</script>
</body>
</html>
